<!DOCTYPE html>
<html lang="az">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cloud File Manager</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            color: #333;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 20px;
        }

        .auth-container {
            max-width: 400px;
            margin: 100px auto;
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(10px);
            border-radius: 20px;
            padding: 40px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.1);
        }

        .file-manager {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(10px);
            border-radius: 20px;
            padding: 30px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.1);
            margin-top: 20px;
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 30px;
            padding-bottom: 20px;
            border-bottom: 2px solid #f0f0f0;
        }

        .logo {
            font-size: 28px;
            font-weight: bold;
            color: #667eea;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .user-info {
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .user-email {
            font-size: 14px;
            color: #666;
        }

        .btn {
            padding: 12px 24px;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            font-size: 14px;
            font-weight: 600;
            transition: all 0.3s ease;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            text-decoration: none;
        }

        .btn-primary {
            background: linear-gradient(135deg, #667eea, #764ba2);
            color: white;
        }

        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 20px rgba(102, 126, 234, 0.3);
        }

        .btn-secondary {
            background: #f8f9fa;
            color: #666;
            border: 1px solid #e9ecef;
        }

        .btn-secondary:hover {
            background: #e9ecef;
        }

        .btn-danger {
            background: #dc3545;
            color: white;
        }

        .btn-danger:hover {
            background: #c82333;
            transform: translateY(-1px);
        }

        .btn-success {
            background: #28a745;
            color: white;
        }

        .btn-success:hover {
            background: #218838;
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-label {
            display: block;
            margin-bottom: 8px;
            font-weight: 600;
            color: #333;
        }

        .form-input {
            width: 100%;
            padding: 12px 16px;
            border: 2px solid #e9ecef;
            border-radius: 10px;
            font-size: 16px;
            transition: all 0.3s ease;
        }

        .form-input:focus {
            outline: none;
            border-color: #667eea;
            box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
        }

        .upload-zone {
            border: 3px dashed #667eea;
            border-radius: 15px;
            padding: 40px;
            text-align: center;
            margin-bottom: 30px;
            transition: all 0.3s ease;
            cursor: pointer;
            background: rgba(102, 126, 234, 0.05);
        }

        .upload-zone:hover {
            border-color: #5a67d8;
            background: rgba(102, 126, 234, 0.1);
        }

        .upload-zone.drag-over {
            border-color: #4c51bf;
            background: rgba(102, 126, 234, 0.15);
        }

        .upload-icon {
            font-size: 48px;
            color: #667eea;
            margin-bottom: 15px;
        }

        .file-input {
            display: none;
        }

        .files-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 20px;
            margin-top: 30px;
        }

        .file-item {
            background: white;
            border-radius: 15px;
            padding: 20px;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.08);
            transition: all 0.3s ease;
            border: 1px solid #f0f0f0;
        }

        .file-item:hover {
            transform: translateY(-5px);
            box-shadow: 0 15px 30px rgba(0, 0, 0, 0.15);
        }

        .file-icon {
            font-size: 40px;
            color: #667eea;
            margin-bottom: 15px;
            text-align: center;
        }

        .file-name {
            font-weight: 600;
            margin-bottom: 15px;
            word-break: break-all;
            color: #333;
        }

        .file-actions {
            display: flex;
            gap: 10px;
            justify-content: center;
        }

        .loading {
            display: none;
            text-align: center;
            padding: 20px;
        }

        .spinner {
            border: 4px solid #f3f3f3;
            border-top: 4px solid #667eea;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
            margin: 0 auto 15px;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .alert {
            padding: 15px 20px;
            border-radius: 10px;
            margin-bottom: 20px;
            font-weight: 500;
        }

        .alert-success {
            background: #d4edda;
            color: #155724;
            border: 1px solid #c3e6cb;
        }

        .alert-danger {
            background: #f8d7da;
            color: #721c24;
            border: 1px solid #f5c6cb;
        }

        .hidden {
            display: none !important;
        }

        .auth-tabs {
            display: flex;
            margin-bottom: 30px;
            border-radius: 10px;
            overflow: hidden;
            background: #f8f9fa;
        }

        .auth-tab {
            flex: 1;
            padding: 15px;
            text-align: center;
            cursor: pointer;
            background: transparent;
            border: none;
            font-weight: 600;
            transition: all 0.3s ease;
        }

        .auth-tab.active {
            background: #667eea;
            color: white;
        }

        .progress-bar {
            width: 100%;
            height: 8px;
            background: #e9ecef;
            border-radius: 4px;
            margin-top: 10px;
            overflow: hidden;
        }

        .progress-fill {
            height: 100%;
            background: linear-gradient(90deg, #667eea, #764ba2);
            width: 0%;
            transition: width 0.3s ease;
        }

        @media (max-width: 768px) {
            .container {
                padding: 10px;
            }

            .auth-container {
                margin: 50px auto;
                padding: 30px 20px;
            }

            .file-manager {
                padding: 20px;
            }

            .header {
                flex-direction: column;
                gap: 15px;
                text-align: center;
            }

            .files-grid {
                grid-template-columns: 1fr;
            }

            .file-actions {
                flex-direction: column;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- Authentication Screen -->
        <div id="authScreen" class="auth-container">
            <div class="logo">
                📁 Cloud File Manager
            </div>
            
            <div class="auth-tabs">
                <button class="auth-tab active" onclick="switchTab('login')">Giriş</button>
                <button class="auth-tab" onclick="switchTab('register')">Qeydiyyat</button>
            </div>

            <div id="alertContainer"></div>

            <!-- Login Form -->
            <form id="loginForm">
                <div class="form-group">
                    <label class="form-label">Email</label>
                    <input type="email" class="form-input" id="loginEmail" required>
                </div>
                <div class="form-group">
                    <label class="form-label">Şifrə</label>
                    <input type="password" class="form-input" id="loginPassword" required>
                </div>
                <button type="submit" class="btn btn-primary" style="width: 100%;">
                    Giriş et
                </button>
            </form>

            <!-- Register Form -->
            <form id="registerForm" class="hidden">
                <div class="form-group">
                    <label class="form-label">Email</label>
                    <input type="email" class="form-input" id="registerEmail" required>
                </div>
                <div class="form-group">
                    <label class="form-label">Şifrə</label>
                    <input type="password" class="form-input" id="registerPassword" required>
                </div>
                <button type="submit" class="btn btn-primary" style="width: 100%;">
                    Qeydiyyatdan keç
                </button>
            </form>
        </div>
<!-- Verify Form -->
<form id="verifyForm" class="hidden">
    <div class="form-group">
        <label class="form-label">Email</label>
        <input type="email" class="form-input" id="verifyEmail" required>
    </div>
    <div class="form-group">
        <label class="form-label">Təsdiq Kodu</label>
        <input type="text" class="form-input" id="verifyCode" required>
    </div>
    <button type="submit" class="btn btn-primary" style="width: 100%;">
        Təsdiqlə
    </button>
</form>
        <!-- File Manager Screen -->
        <div id="fileManagerScreen" class="hidden">
            <div class="file-manager">
                <div class="header">
                    <div class="logo">
                        📁 File Manager
                    </div>
                    <div class="user-info">
                        <span class="user-email" id="userEmail"></span>
                        <button class="btn btn-secondary" onclick="logout()">
                            🚪 Çıxış
                        </button>
                    </div>
                </div>

                <div id="alertContainer2"></div>

                <!-- Upload Zone -->
                <div class="upload-zone" id="uploadZone" onclick="document.getElementById('fileInput').click()">
                    <div class="upload-icon">☁️</div>
                    <h3>Faylları yükləmək üçün klikləyin və ya buraya sürükləyin</h3>
                    <p style="color: #666; margin-top: 10px;">Bütün fayl növləri dəstəklənir</p>
                    <input type="file" id="fileInput" class="file-input" multiple>
                </div>

                <!-- Upload Progress -->
                <div id="uploadProgress" class="hidden">
                    <div class="progress-bar">
                        <div class="progress-fill" id="progressFill"></div>
                    </div>
                    <p style="text-align: center; margin-top: 10px;" id="progressText">Yüklənir...</p>
                </div>

                <!-- Loading -->
                <div class="loading" id="loading">
                    <div class="spinner"></div>
                    <p>Yüklənir...</p>
                </div>

                <!-- Files Grid -->
                <div class="files-grid" id="filesGrid"></div>
            </div>
        </div>
    </div>

    <script>
        const API_BASE = 'https://api.primetradegroup.az/api';
        let authToken = localStorage.getItem('authToken');
        let currentUser = null;
try {
  const stored = localStorage.getItem('currentUser');
  if (stored && stored !== "undefined") {
    currentUser = JSON.parse(stored);
  }
} catch {}

        // Initialize app
        document.addEventListener('DOMContentLoaded', function() {
            if (authToken && currentUser) {
                showFileManager();
                loadFiles();
            } else {
                showAuth();
            }

            setupEventListeners();
        });

       function setupEventListeners() {
    document.getElementById('loginForm').addEventListener('submit', handleLogin);
    document.getElementById('registerForm').addEventListener('submit', handleRegister);
    document.getElementById('verifyForm').addEventListener('submit', handleVerify); // ✅
    
    document.getElementById('fileInput').addEventListener('change', handleFileSelect);

    const uploadZone = document.getElementById('uploadZone');
    uploadZone.addEventListener('dragover', handleDragOver);
    uploadZone.addEventListener('dragleave', handleDragLeave);
    uploadZone.addEventListener('drop', handleDrop);
}

        // Authentication functions
        function switchTab(tab) {
            const tabs = document.querySelectorAll('.auth-tab');
            const forms = [document.getElementById('loginForm'), document.getElementById('registerForm')];
            
            tabs.forEach(t => t.classList.remove('active'));
            forms.forEach(f => f.classList.add('hidden'));
            
            if (tab === 'login') {
                tabs[0].classList.add('active');
                forms[0].classList.remove('hidden');
            } else {
                tabs[1].classList.add('active');
                forms[1].classList.remove('hidden');
            }
        }

async function handleLogin(e) {
    e.preventDefault();
    const email = document.getElementById('loginEmail').value;
    const password = document.getElementById('loginPassword').value;
    
    try {
        const response = await fetch(`${API_BASE}/auth/login`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ email, password })
        });
        
        const data = await response.json();
        
        if (response.ok) {
            authToken = data.token;
            currentUser = { email }; // ✅ yalnız email saxlanır
            localStorage.setItem('authToken', authToken);
            localStorage.setItem('currentUser', JSON.stringify(currentUser));
            showAlert('Giriş uğurlu!', 'success');
            setTimeout(() => {
                showFileManager();
                loadFiles();
            }, 1000);
        } else {
            showAlert(data.error || data.message, 'danger');
        }
    } catch (error) {
        showAlert('Giriş xətası: ' + error.message, 'danger');
    }
}

  async function handleRegister(e) {
    e.preventDefault();
    const email = document.getElementById('registerEmail').value;
    const password = document.getElementById('registerPassword').value;

    try {
        const response = await fetch(`${API_BASE}/auth/register`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ email, password })
        });

        const data = await response.json();

        if (response.ok) {
            showAlert('Qeydiyyat uğurlu! Mailə kod göndərildi.', 'success');
            
            // ✅ Verify formunu göstər
            document.getElementById('registerForm').classList.add('hidden');
            document.getElementById('verifyForm').classList.remove('hidden');
            document.getElementById('verifyEmail').value = email;
        } else {
            showAlert(data.error || data.message, 'danger');
        }
    } catch (error) {
        showAlert('Qeydiyyat xətası: ' + error.message, 'danger');
    }
}
async function handleVerify(e) {
    e.preventDefault();
    const email = document.getElementById('verifyEmail').value;
    const code = document.getElementById('verifyCode').value;

    try {
        const response = await fetch(`${API_BASE}/auth/verify`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ email, code })
        });

        const data = await response.json();

        if (response.ok) {
            showAlert('Email uğurla təsdiqləndi!', 'success');
            
            // ✅ Girişə yönləndir
            document.getElementById('verifyForm').classList.add('hidden');
            document.getElementById('loginForm').classList.remove('hidden');
        } else {
            showAlert(data.error || data.message, 'danger');
        }
    } catch (error) {
        showAlert('Təsdiq xətası: ' + error.message, 'danger');
    }
}

        
        function logout() {
            authToken = null;
            currentUser = null;
            localStorage.removeItem('authToken');
            localStorage.removeItem('currentUser');
            showAuth();
        }

        // UI functions
        function showAuth() {
            document.getElementById('authScreen').classList.remove('hidden');
            document.getElementById('fileManagerScreen').classList.add('hidden');
        }

       function showFileManager() {
    document.getElementById('authScreen').classList.add('hidden');
    document.getElementById('fileManagerScreen').classList.remove('hidden');
    document.getElementById('userEmail').textContent = currentUser?.email || "Naməlum istifadəçi";
}

        function showAlert(message, type, container = 'alertContainer') {
            const alertDiv = document.createElement('div');
            alertDiv.className = `alert alert-${type}`;
            alertDiv.textContent = message;
            
            const containerEl = document.getElementById(container);
            containerEl.innerHTML = '';
            containerEl.appendChild(alertDiv);
            
            setTimeout(() => {
                alertDiv.remove();
            }, 5000);
        }

        function showLoading(show = true) {
            document.getElementById('loading').style.display = show ? 'block' : 'none';
        }

        // File functions
        async function loadFiles() {
            showLoading(true);
            try {
                const response = await fetch(`${API_BASE}/files/list`, {
                    headers: { 'Authorization': `Bearer ${authToken}` }
                });
                
                const files = await response.json();
                displayFiles(files);
            } catch (error) {
                showAlert('Fayllar yüklənə bilmədi: ' + error.message, 'danger', 'alertContainer2');
            }
            showLoading(false);
        }

        function displayFiles(files) {
            const grid = document.getElementById('filesGrid');
            grid.innerHTML = '';
            
            if (files.length === 0) {
                grid.innerHTML = `
                    <div style="grid-column: 1 / -1; text-align: center; padding: 40px; color: #666;">
                        <div style="font-size: 64px; margin-bottom: 20px;">📁</div>
                        <h3>Heç bir fayl tapılmadı</h3>
                        <p>Faylları yükləmək üçün yuxarıdakı zonaya sürükləyin</p>
                    </div>
                `;
                return;
            }
            
            files.forEach(file => {
                const fileDiv = document.createElement('div');
                fileDiv.className = 'file-item';
                
                const extension = file.filename.split('.').pop().toLowerCase();
                const icon = getFileIcon(extension);
                
                fileDiv.innerHTML = `
                    <div class="file-icon">${icon}</div>
                    <div class="file-name" title="${file.filename}">${file.filename}</div>
                    <div class="file-actions">
                        <button class="btn btn-success" onclick="downloadFile(${file.id}, '${file.filename}')">
                            ⬇️ Yüklə
                        </button>
                        <button class="btn btn-danger" onclick="deleteFile(${file.id})">
                            🗑️ Sil
                        </button>
                    </div>
                `;
                
                grid.appendChild(fileDiv);
            });
        }

        function getFileIcon(extension) {
            const icons = {
                pdf: '📄', doc: '📝', docx: '📝', txt: '📄',
                jpg: '🖼️', jpeg: '🖼️', png: '🖼️', gif: '🖼️', svg: '🖼️',
                mp4: '🎬', avi: '🎬', mov: '🎬', mkv: '🎬',
                mp3: '🎵', wav: '🎵', flac: '🎵',
                zip: '📦', rar: '📦', '7z': '📦',
                xlsx: '📊', xls: '📊', csv: '📊',
                pptx: '📈', ppt: '📈'
            };
            return icons[extension] || '📄';
        }

        // File upload
        function handleFileSelect(e) {
            const files = Array.from(e.target.files);
            uploadFiles(files);
        }

        function handleDragOver(e) {
            e.preventDefault();
            document.getElementById('uploadZone').classList.add('drag-over');
        }

        function handleDragLeave(e) {
            e.preventDefault();
            document.getElementById('uploadZone').classList.remove('drag-over');
        }

        function handleDrop(e) {
            e.preventDefault();
            document.getElementById('uploadZone').classList.remove('drag-over');
            const files = Array.from(e.dataTransfer.files);
            uploadFiles(files);
        }

        async function uploadFiles(files) {
            if (files.length === 0) return;
            
            const progressDiv = document.getElementById('uploadProgress');
            const progressFill = document.getElementById('progressFill');
            const progressText = document.getElementById('progressText');
            
            progressDiv.classList.remove('hidden');
            
            for (let i = 0; i < files.length; i++) {
                const file = files[i];
                const formData = new FormData();
                formData.append('file', file);
                
                progressText.textContent = `${file.name} yüklənir... (${i + 1}/${files.length})`;
                progressFill.style.width = `${((i + 1) / files.length) * 100}%`;
                
                try {
                    const response = await fetch(`${API_BASE}/files/upload`, {
                        method: 'POST',
                        headers: { 'Authorization': `Bearer ${authToken}` },
                        body: formData
                    });
                    
                    if (!response.ok) {
                        throw new Error(`${file.name} yüklənə bilmədi`);
                    }
                } catch (error) {
                    showAlert(error.message, 'danger', 'alertContainer2');
                }
            }
            
            progressDiv.classList.add('hidden');
            document.getElementById('fileInput').value = '';
            showAlert(`${files.length} fayl uğurla yükləndi!`, 'success', 'alertContainer2');
            loadFiles();
        }

        async function downloadFile(fileId, filename) {
            try {
                const response = await fetch(`${API_BASE}/files/download/${fileId}`, {
                    headers: { 'Authorization': `Bearer ${authToken}` }
                });
                
                if (response.ok) {
                    const blob = await response.blob();
                    const url = window.URL.createObjectURL(blob);
                    const a = document.createElement('a');
                    a.href = url;
                    a.download = filename;
                    document.body.appendChild(a);
                    a.click();
                    document.body.removeChild(a);
                    window.URL.revokeObjectURL(url);
                } else {
                    throw new Error('Fayl yüklənə bilmədi');
                }
            } catch (error) {
                showAlert('Yükləmə xətası: ' + error.message, 'danger', 'alertContainer2');
            }
        }

        async function deleteFile(fileId) {
            if (!confirm('Bu faylı silmək istədiyinizə əminsiniz?')) return;
            
            try {
                const response = await fetch(`${API_BASE}/files/delete/${fileId}`, {
                    method: 'DELETE',
                    headers: { 'Authorization': `Bearer ${authToken}` }
                });
                
                if (response.ok) {
                    showAlert('Fayl uğurla silindi!', 'success', 'alertContainer2');
                    loadFiles();
                } else {
                    throw new Error('Fayl silinə bilmədi');
                }
            } catch (error) {
                showAlert('Silmə xətası: ' + error.message, 'danger', 'alertContainer2');
            }
        }
    </script>
</body>
</html>
