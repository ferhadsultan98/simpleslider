<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Trello-like Kanban Board</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <style>
    /* ---------- Global Styles ---------- */
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: var(--bg);
      color: var(--text);
      transition: background 0.3s, color 0.3s;
    }
    :root {
      --bg: #f4f4f4;
      --text: #333;
      --card: #fff;
      --primary: #1976d2;
    }
    body.dark {
      --bg: #1e1e1e;
      --text: #f4f4f4;
      --card: #2a2a2a;
      --primary: #90caf9;
    }
    h2 { margin: 10px; }
    button { cursor: pointer; }
    .hidden { display: none; }

    /* ---------- Auth Forms ---------- */
    .auth-container {
      max-width: 350px;
      margin: 50px auto;
      padding: 20px;
      background: var(--card);
      border-radius: 8px;
      box-shadow: 0 2px 5px rgba(0,0,0,0.2);
    }
    .auth-container input, .auth-container button {
      width: 100%;
      margin: 5px 0;
      padding: 10px;
      border: 1px solid #ccc;
      border-radius: 6px;
    }

    /* ---------- Board Layout ---------- */
    .board {
      display: flex;
      gap: 10px;
      padding: 10px;
      overflow-x: auto;
      height: calc(100vh - 100px);
    }
    .list {
      flex: 1 1 300px;
      background: var(--card);
      border-radius: 8px;
      padding: 10px;
      display: flex;
      flex-direction: column;
    }
    .list h3 { text-align: center; }
    .
