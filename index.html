<!DOCTYPE html>
<html lang="az">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EduSys Pro - Peşəkar Təhsil Platforması</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

    <style>
        /* CSS: 1. Qlobal Stillər, Dəyişənlər və Mövzular */
        :root {
            --primary-color: #007aff;
            --primary-hover: #005ce6;
            --secondary-color: #6c757d;
            --success-color: #28a745;
            --danger-color: #dc3545;
            --warning-color: #ffc107;
            --font-family: 'Poppins', sans-serif;
            
            --text-color: #212529;
            --bg-color: #f8f9fa;
            --card-bg-color: #ffffff;
            --border-color: #dee2e6;
            --shadow: 0 4px 12px rgba(0, 0, 0, 0.08);
        }

        [data-theme="dark"] {
            --text-color: #f8f9fa;
            --bg-color: #121212;
            --card-bg-color: #1e1e1e;
            --border-color: #444;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }
        html { scroll-behavior: smooth; }
        body {
            font-family: var(--font-family);
            background-color: var(--bg-color);
            color: var(--text-color);
            transition: background-color 0.3s, color 0.3s;
            line-height: 1.7;
        }
        .container { max-width: 1200px; margin: 0 auto; padding: 25px; }
        .hidden { display: none !important; }
        
        /* CSS: 2. Əsas Komponentlər (Düymə, Kart, Modal, Bildiriş) */
        .card { background-color: var(--card-bg-color); border-radius: 10px; box-shadow: var(--shadow); padding: 25px; margin-bottom: 25px; }
        .btn { display: inline-block; padding: 10px 20px; border-radius: 8px; border: none; font-family: var(--font-family); font-weight: 500; cursor: pointer; text-decoration: none; text-align: center; transition: all 0.2s ease; }
        .btn-primary { background-color: var(--primary-color); color: white; }
        .btn-primary:hover { background-color: var(--primary-hover); transform: translateY(-2px); }
        .btn-danger { background-color: var(--danger-color); color: white; }
        .btn-success { background-color: var(--success-color); color: white; }
        
        .modal { /* ... (Əvvəlki kod ilə eyni) ... */ }
        .toast-container { position: fixed; top: 20px; right: 20px; z-index: 9999; }
        .toast { padding: 15px 20px; margin-bottom: 10px; border-radius: 8px; color: white; font-weight: 500; box-shadow: var(--shadow); opacity: 0; transform: translateX(100%); animation: slideIn 0.5s forwards; }
        .toast.success { background-color: var(--success-color); }
        .toast.error { background-color: var(--danger-color); }
        @keyframes slideIn { to { opacity: 1; transform: translateX(0); } }

        .loader { width: 50px; height: 50px; border: 5px solid var(--border-color); border-top-color: var(--primary-color); border-radius: 50%; animation: spin 1s linear infinite; margin: 50px auto; }
        @keyframes spin { to { transform: rotate(360deg); } }

        /* CSS: 3. Layaut və Naviqasiya */
        #app-wrapper { display: flex; flex-direction: column; min-height: 100vh; }
        .navbar { background-color: var(--card-bg-color); box-shadow: var(--shadow); width: 100%; z-index: 1000; }
        .navbar .container { display: flex; justify-content: space-between; align-items: center; height: 70px; padding: 0 25px; }
        .nav-logo { font-size: 1.6rem; font-weight: 700; color: var(--primary-color); text-decoration: none; }
        .nav-links { list-style: none; display: flex; gap: 15px; }
        .nav-links a { text-decoration: none; color: var(--secondary-color); font-weight: 500; padding: 8px 12px; border-radius: 8px; transition: all 0.3s ease; }
        .nav-links a:hover { color: var(--primary-color); background-color: rgba(0, 122, 255, 0.1); }
        .nav-links a.active-link { color: var(--primary-color); font-weight: 600; }
        
        #main-content { flex-grow: 1; }
        
        /* CSS: 4. Xüsusi Bölmə Stilləri */
        /* İmtahan */
        #exam-timer { font-size: 1.5rem; font-weight: 600; color: var(--primary-color); text-align: center; margin-bottom: 20px; }
        .exam-review .question.correct { border-left: 5px solid var(--success-color); padding-left: 15px; }
        .exam-review .question.incorrect { border-left: 5px solid var(--danger-color); padding-left: 15px; }
        .exam-review .user-answer { font-style: italic; color: var(--secondary-color); }
        .exam-review .correct-answer-text { font-weight: 600; color: var(--success-color); }
        
        /* Diaqram */
        .chart-container { width: 100%; height: 300px; }
        .chart-container .bar { transition: all 0.5s ease; }
        .chart-container .bar:hover { opacity: 0.8; }
        
    </style>
</head>
<body>

    <div id="app-wrapper">
        <header id="navbar-container"></header>

        <main id="main-content" class="container"></main>
    </div>

    <div id="toast-container" class="toast-container"></div>
    
    <script>
    // ===================================================================================
    // JS: 1. Tətbiqin Konfiqurasiyası və Vəziyyəti (App Config & State)
    // ===================================================================================
    const appState = {
        currentUser: null,
        currentRoute: '#login',
        questions: [],
        lessons: [],
        examResults: [],
        settings: {
            theme: 'light'
        },
        isLoading: false
    };

    // ===================================================================================
    // JS: 2. API Simulyasiyası (localStorage ilə işləyir)
    // ===================================================================================
    const ApiService = {
        _simulateLatency: (data) => new Promise(resolve => setTimeout(() => resolve(data), 500)),

        fetchUser: function() {
            const user = JSON.parse(localStorage.getItem('currentUser'));
            return this._simulateLatency(user);
        },
        login: function(role) {
            const user = (role === 'teacher')
                ? { id: 1, name: "Dr. Elvin Ağayev", role: 'teacher', email: 'e.agayev@edu.az' }
                : { id: 2, name: "Leyla Quliyeva", role: 'student', email: 'l.quliyeva@edu.az' };
            localStorage.setItem('currentUser', JSON.stringify(user));
            return this._simulateLatency(user);
        },
        logout: function() {
            localStorage.removeItem('currentUser');
            return this._simulateLatency(null);
        },
        fetchData: function() {
            let questions = JSON.parse(localStorage.getItem('questions'));
            let examResults = JSON.parse(localStorage.getItem('examResults'));

            if (!questions || questions.length === 0) {
                questions = [
                    { id: 1, subject: 'Coğrafiya', text: 'Dünyanın ən hündür dağı hansıdır?', options: ['Monblan', 'K2', 'Everest', 'Elbrus'], correctAnswer: 'Everest' },
                    { id: 2, subject: 'Biologiya', text: 'İnsan bədənində neçə sümük var?', options: ['206', '212', '198', '221'], correctAnswer: '206' },
                    { id: 3, subject: 'Tarix', text: 'İkinci Dünya Müharibəsi neçənci ildə başlamışdır?', options: ['1935', '1939', '1941', '1945'], correctAnswer: '1939' }
                ];
                localStorage.setItem('questions', JSON.stringify(questions));
            }
             if (!examResults) {
                examResults = [];
                localStorage.setItem('examResults', JSON.stringify(examResults));
            }

            return this._simulateLatency({ questions, examResults });
        },
        saveExamResult: function(result) {
            let results = JSON.parse(localStorage.getItem('examResults')) || [];
            results.push(result);
            localStorage.setItem('examResults', JSON.stringify(results));
            return this._simulateLatency(result);
        },
        saveSettings: function(settings) {
            localStorage.setItem('settings', JSON.stringify(settings));
            return this._simulateLatency(settings);
        },
        fetchSettings: function() {
            const settings = JSON.parse(localStorage.getItem('settings'));
            return this._simulateLatency(settings || { theme: 'light' });
        }
    };

    // ===================================================================================
    // JS: 3. Köməkçi Funksiyalar (Utilities)
    // ===================================================================================
    const Utils = {
        $: (selector) => document.querySelector(selector),
        $$: (selector) => document.querySelectorAll(selector),
        showToast: (message, type = 'success') => {
            const container = Utils.$('#toast-container');
            const toast = document.createElement('div');
            toast.className = `toast ${type}`;
            toast.textContent = message;
            container.appendChild(toast);
            setTimeout(() => {
                toast.style.animation = 'slideOut 0.5s forwards';
                toast.addEventListener('animationend', () => toast.remove());
            }, 3000);
            // Add slideOut animation if you want a smoother exit
            const style = document.createElement('style');
            style.innerHTML = `@keyframes slideOut { from { opacity: 1; transform: translateX(0); } to { opacity: 0; transform: translateX(100%); } }`;
            document.head.appendChild(style);
        },
        formatTime: (seconds) => {
            const mins = Math.floor(seconds / 60).toString().padStart(2, '0');
            const secs = (seconds % 60).toString().padStart(2, '0');
            return `${mins}:${secs}`;
        }
    };
    
    // ===================================================================================
    // JS: 4. UI Komponentləri (UI Components)
    // ===================================================================================
    const NavbarComponent = {
        render: () => {
            if (!appState.currentUser) return '';
            const { role } = appState.currentUser;
            return `
                <div class="container">
                    <a href="#dashboard" class="nav-logo">EduSys Pro</a>
                    <nav>
                        <ul class="nav-links">
                            <li><a href="#dashboard" class="${appState.currentRoute === '#dashboard' ? 'active-link' : ''}">İdarə Paneli</a></li>
                            ${role === 'student' ? `<li><a href="#exams" class="${appState.currentRoute === '#exams' ? 'active-link' : ''}">İmtahanlar</a></li>` : ''}
                            ${role === 'teacher' ? `<li><a href="#questions" class="${appState.currentRoute === '#questions' ? 'active-link' : ''}">Suallar</a></li>` : ''}
                            <li><a href="#settings" class="${appState.currentRoute === '#settings' ? 'active-link' : ''}">Ayarlar</a></li>
                            <li><button id="logout-btn" class="btn btn-danger">Çıxış</button></li>
                        </ul>
                    </nav>
                </div>`;
        },
        attachEventListeners: () => {
            if (!appState.currentUser) return;
            Utils.$('#logout-btn').addEventListener('click', async () => {
                await ApiService.logout();
                appState.currentUser = null;
                Router.navigate('#login');
            });
        }
    };

    const LoginComponent = {
        render: () => `
            <div class="card" style="text-align: center; max-width: 500px; margin: 100px auto;">
                <h1>Platformaya Xoş Gəlmisiniz!</h1>
                <p>Zəhmət olmasa, rolunuzu seçərək daxil olun.</p>
                <div style="margin-top: 20px;">
                    <button class="btn btn-primary" data-role="teacher">Müəllim kimi daxil ol</button>
                    <button class="btn btn-primary" data-role="student" style="margin-left: 10px;">Tələbə kimi daxil ol</button>
                </div>
            </div>`,
        attachEventListeners: () => {
            Utils.$('#main-content').addEventListener('click', async (e) => {
                const role = e.target.dataset.role;
                if (role) {
                    appState.currentUser = await ApiService.login(role);
                    await App.initData();
                    Router.navigate('#dashboard');
                }
            });
        }
    };

    const DashboardComponent = {
        render: () => {
            const { name, role } = appState.currentUser;
            const results = appState.examResults.filter(r => r.userId === appState.currentUser.id);

            // Simple SVG Bar Chart
            const maxScore = 100;
            const barWidth = 50;
            const spacing = 20;
            let bars = results.map((r, i) => {
                const barHeight = (r.score / maxScore) * 200; // max height 200px
                const x = i * (barWidth + spacing);
                return `<g>
                    <rect class="bar" x="${x}" y="${220 - barHeight}" width="${barWidth}" height="${barHeight}" fill="var(--primary-color)"></rect>
                    <text x="${x + barWidth / 2}" y="240" text-anchor="middle" fill="var(--text-color)">İmtahan ${i+1}</text>
                </g>`;
            }).join('');

            return `
                <h2>Xoş gəldin, ${name}!</h2>
                <div class="card">
                    <h3>Fəaliyyət İcmalı</h3>
                    <p>Rol: ${role === 'teacher' ? 'Müəllim' : 'Tələbə'}</p>
                </div>
                ${role === 'student' ? `
                <div class="card">
                    <h3>İmtahan Nəticələrim</h3>
                    ${results.length > 0 ? `
                    <div class="chart-container">
                        <svg width="100%" height="250">${bars}</svg>
                    </div>` : '<p>Hələ heç bir imtahan verməmisiniz.</p>'}
                </div>` : ''}`;
        },
        attachEventListeners: () => {}
    };

    const ExamsComponent = {
        state: {
            currentExam: null,
            timer: null,
            timeLeft: 600 // 10 minutes
        },
        render: () => {
            return `
                <h2>İmtahanlar</h2>
                <div class="card">
                    <h3>Mövcud İmtahanlar</h3>
                    <p>Ümumi Bilik İmtahanı (${appState.questions.length} sual)</p>
                    <button id="start-exam-btn" class="btn btn-success">İmtahana Başla</button>
                </div>
                <div id="exam-view" class="hidden"></div>`;
        },
        attachEventListeners: () => {
            Utils.$('#start-exam-btn').addEventListener('click', ExamsComponent.startExam);
        },
        startExam: () => {
            Utils.$('#start-exam-btn').parentElement.classList.add('hidden');
            Utils.$('#exam-view').classList.remove('hidden');
            ExamsComponent.state.currentExam = appState.questions;
            ExamsComponent.state.timeLeft = ExamsComponent.state.currentExam.length * 60; // 1 min per question
            
            ExamsComponent.renderExamView();
            ExamsComponent.state.timer = setInterval(ExamsComponent.updateTimer, 1000);
        },
        renderExamView: () => {
            let questionsHTML = ExamsComponent.state.currentExam.map((q, i) => `
                <div class="question card">
                    <p><b>${i+1}. ${q.text}</b></p>
                    ${q.options.map(opt => `
                        <div>
                            <label><input type="radio" name="q${q.id}" value="${opt}" required> ${opt}</label>
                        </div>`).join('')}
                </div>`).join('');

            Utils.$('#exam-view').innerHTML = `
                <div id="exam-timer">${Utils.formatTime(ExamsComponent.state.timeLeft)}</div>
                <form id="exam-form">${questionsHTML}<button type="submit" class="btn btn-primary">İmtahanı Bitir</button></form>`;
            
            Utils.$('#exam-form').addEventListener('submit', ExamsComponent.submitExam);
        },
        updateTimer: () => {
            ExamsComponent.state.timeLeft--;
            Utils.$('#exam-timer').textContent = Utils.formatTime(ExamsComponent.state.timeLeft);
            if (ExamsComponent.state.timeLeft <= 0) {
                ExamsComponent.submitExam(new Event('submit'));
            }
        },
        submitExam: async (e) => {
            e.preventDefault();
            clearInterval(ExamsComponent.state.timer);
            
            const formData = new FormData(Utils.$('#exam-form'));
            let score = 0;
            let userAnswers = [];

            for (const q of ExamsComponent.state.currentExam) {
                const userAnswer = formData.get(`q${q.id}`);
                userAnswers.push({ questionId: q.id, answer: userAnswer });
                if (userAnswer === q.correctAnswer) {
                    score++;
                }
            }

            const result = {
                id: Date.now(),
                userId: appState.currentUser.id,
                score: (score / ExamsComponent.state.currentExam.length) * 100,
                answers: userAnswers,
                date: new Date().toISOString()
            };

            await ApiService.saveExamResult(result);
            appState.examResults.push(result);

            Utils.showToast('İmtahan uğurla bitdi!', 'success');
            ExamsComponent.renderReviewView(result);
        },
        renderReviewView: (result) => {
             let reviewHTML = `<h2>İmtahan Nəticəsi</h2>
                <div class="card">
                    <h3>Ümumi Nəticə: ${result.score.toFixed(2)}%</h3>
                    <p>${ExamsComponent.state.currentExam.length} sualdan ${Math.round(result.score/100 * ExamsComponent.state.currentExam.length)} düzgün cavab.</p>
                </div>
                <h3>Səhvlərin Təhlili</h3>`;
            
            result.answers.forEach(ua => {
                const question = appState.questions.find(q => q.id === ua.questionId);
                const isCorrect = ua.answer === question.correctAnswer;
                reviewHTML += `
                <div class="question card ${isCorrect ? 'correct' : 'incorrect'}">
                    <p><b>${question.text}</b></p>
                    <p class="user-answer">Sizin cavabınız: ${ua.answer || 'Boş buraxılıb'}</p>
                    ${!isCorrect ? `<p class="correct-answer-text">Düzgün cavab: ${question.correctAnswer}</p>` : ''}
                </div>`;
            });

            Utils.$('#exam-view').innerHTML = `<div class="exam-review">${reviewHTML}</div>`;
        }
    };
    
    const SettingsComponent = {
        render: () => {
            return `
            <h2>Ayarlar</h2>
            <div class="card">
                <h3>Görünüş</h3>
                <label for="theme-select">Mövzu:</label>
                <select id="theme-select">
                    <option value="light" ${appState.settings.theme === 'light' ? 'selected' : ''}>Açıq</option>
                    <option value="dark" ${appState.settings.theme === 'dark' ? 'selected' : ''}>Tünd</option>
                </select>
            </div>`;
        },
        attachEventListeners: () => {
            Utils.$('#theme-select').addEventListener('change', async (e) => {
                appState.settings.theme = e.target.value;
                document.documentElement.setAttribute('data-theme', appState.settings.theme);
                await ApiService.saveSettings(appState.settings);
                Utils.showToast('Mövzu dəyişdirildi.');
            });
        }
    };
    
    const NotFoundComponent = {
        render: () => `<h2>404 - Səhifə Tapılmadı</h2><p>Axtardığınız səhifə mövcud deyil.</p>`,
        attachEventListeners: () => {}
    };

    // ===================================================================================
    // JS: 5. Router (Səhifə Naviqasiyası)
    // ===================================================================================
    const Router = {
        routes: {
            '#login': LoginComponent,
            '#dashboard': DashboardComponent,
            '#exams': ExamsComponent,
            '#settings': SettingsComponent
        },
        navigate: (hash) => {
            window.location.hash = hash;
        },
        handleRouteChange: () => {
            appState.currentRoute = window.location.hash || '#login';
            
            if (!appState.currentUser && appState.currentRoute !== '#login') {
                Router.navigate('#login');
                return;
            }
            if (appState.currentUser && appState.currentRoute === '#login') {
                Router.navigate('#dashboard');
                return;
            }
            
            const component = Router.routes[appState.currentRoute] || NotFoundComponent;
            
            // Render navbar & page content
            Utils.$('#navbar-container').innerHTML = NavbarComponent.render();
            Utils.$('#main-content').innerHTML = component.render();

            // Attach event listeners
            NavbarComponent.attachEventListeners();
            component.attachEventListeners();
        }
    };

    // ===================================================================================
    // JS: 6. Tətbiqin Başladılması (App Initialization)
    // ===================================================================================
    const App = {
        initData: async () => {
            const { questions, examResults } = await ApiService.fetchData();
            appState.questions = questions;
            appState.examResults = examResults;
            const settings = await ApiService.fetchSettings();
            appState.settings = settings;
            document.documentElement.setAttribute('data-theme', appState.settings.theme);
        },
        init: async () => {
            // Check for logged-in user first
            appState.currentUser = await ApiService.fetchUser();
            
            if (appState.currentUser) {
                Utils.$('#main-content').innerHTML = `<div class="loader"></div>`;
                await App.initData();
            }

            // Setup router
            window.addEventListener('hashchange', Router.handleRouteChange);
            
            // Initial route handling
            if (!window.location.hash) {
                window.location.hash = appState.currentUser ? '#dashboard' : '#login';
            } else {
                Router.handleRouteChange();
            }
        }
    };

    // Tətbiqi başladın
    App.init();

    </script>
</body>
</html>
