<!DOCTYPE html>
<html lang="az">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EduSys Pro Enterprise - Təhsil Platforması</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

    <style>
        /* CSS: 1. Qlobal Stillər, Dəyişənlər və Mövzular */
        :root {
            --primary-color: #007aff; --primary-hover: #005ce6; --secondary-color: #6c757d;
            --success-color: #28a745; --danger-color: #dc3545; --warning-color: #ffc107; --info-color: #17a2b8;
            --font-family: 'Poppins', sans-serif;
            --text-color: #212529; --bg-color: #f4f6f9; --card-bg-color: #ffffff;
            --border-color: #dee2e6; --shadow: 0 4px 12px rgba(0, 0, 0, 0.08);
        }
        [data-theme="dark"] {
            --text-color: #f8f9fa; --bg-color: #121212; --card-bg-color: #1e1e1e; --border-color: #444;
        }

        /* CSS: 2. Ümumi Tənzimləmələr */
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: var(--font-family); background-color: var(--bg-color); color: var(--text-color); transition: background-color 0.3s, color 0.3s; line-height: 1.7; }
        .container { max-width: 1400px; margin: 0 auto; padding: 25px; }
        .hidden { display: none !important; }
        h2, h3 { margin-bottom: 20px; font-weight: 600; }
        
        /* CSS: 3. Əsas Komponentlər */
        .card { background-color: var(--card-bg-color); border-radius: 10px; box-shadow: var(--shadow); padding: 25px; margin-bottom: 25px; }
        .btn { display: inline-flex; align-items: center; gap: 8px; padding: 10px 20px; border-radius: 8px; border: none; font-weight: 500; cursor: pointer; text-decoration: none; transition: all 0.2s ease; }
        .btn-primary { background-color: var(--primary-color); color: white; }
        .btn-primary:hover { background-color: var(--primary-hover); transform: translateY(-2px); }
        .btn-danger { background-color: var(--danger-color); color: white; }
        .btn-success { background-color: var(--success-color); color: white; }
        .btn-secondary { background-color: var(--secondary-color); color: white; }
        
        .form-group { margin-bottom: 15px; }
        .form-group label { display: block; margin-bottom: 5px; font-weight: 500; }
        .form-group input, .form-group select, .form-group textarea { width: 100%; padding: 10px; border: 1px solid var(--border-color); border-radius: 5px; background-color: var(--bg-color); color: var(--text-color); font-family: var(--font-family); }
        
        .toast-container { position: fixed; bottom: 20px; right: 20px; z-index: 9999; }
        .toast { padding: 15px 20px; margin-top: 10px; border-radius: 8px; color: white; font-weight: 500; box-shadow: var(--shadow); opacity: 0; transform: translateY(100%); animation: slideUp 0.5s forwards; }
        .toast.success { background-color: var(--success-color); }
        .toast.error { background-color: var(--danger-color); }
        @keyframes slideUp { to { opacity: 1; transform: translateY(0); } }
        
        .loader { width: 50px; height: 50px; border: 5px solid var(--border-color); border-top-color: var(--primary-color); border-radius: 50%; animation: spin 1s linear infinite; margin: 50px auto; }
        @keyframes spin { to { transform: rotate(360deg); } }

        /* CSS: 4. Məlumat Cədvəlləri */
        .table-wrapper { overflow-x: auto; }
        .data-table { width: 100%; border-collapse: collapse; margin-top: 20px; }
        .data-table th, .data-table td { padding: 12px 15px; text-align: left; border-bottom: 1px solid var(--border-color); }
        .data-table th { background-color: var(--card-bg-color); cursor: pointer; user-select: none; }
        .data-table th:hover { background-color: var(--bg-color); }
        .data-table th .sort-icon { margin-left: 5px; opacity: 0.5; }
        .data-table tbody tr:hover { background-color: var(--bg-color); }
        .table-filters { display: flex; gap: 15px; margin-bottom: 20px; flex-wrap: wrap; }
        
        /* CSS: 5. Xüsusi Modullar */
        .exam-builder-container { display: grid; grid-template-columns: 2fr 1fr; gap: 25px; }
        .question-selection-list { max-height: 400px; overflow-y: auto; border: 1px solid var(--border-color); padding: 10px; border-radius: 5px; }
        .question-selection-item { display: flex; justify-content: space-between; align-items: center; padding: 8px; border-bottom: 1px solid var(--border-color); }
        .selected-questions-list .question-selection-item { background-color: var(--bg-color); }

        /* CSS: 6. Layaut və Naviqasiya */
        #app-wrapper { display: flex; flex-direction: column; min-height: 100vh; }
        .navbar { background-color: var(--card-bg-color); box-shadow: var(--shadow); width: 100%; z-index: 1000; }
        .navbar .container { display: flex; justify-content: space-between; align-items: center; height: 70px; padding: 0 25px; }
        .nav-logo { font-size: 1.6rem; font-weight: 700; color: var(--primary-color); text-decoration: none; }
        .nav-links { list-style: none; display: flex; gap: 15px; }
        .nav-links a { text-decoration: none; color: var(--secondary-color); font-weight: 500; padding: 8px 12px; border-radius: 8px; transition: all 0.3s ease; }
        .nav-links a.active-link { color: var(--primary-color); font-weight: 600; background-color: rgba(0, 122, 255, 0.1); }
        #main-content { flex-grow: 1; }
    </style>
</head>
<body>
    <div id="app-wrapper">
        <header id="navbar-container"></header>
        <main id="main-content" class="container"></main>
    </div>
    <div id="toast-container"></div>

    <script>
    // ===================================================================================
    // JS: 1. Tətbiqin Vəziyyəti (App State) - Bütün proqramın məlumatları burada saxlanılır
    // ===================================================================================
    const appState = {
        currentUser: null,
        currentRoute: '#login',
        users: [],
        questions: [],
        exams: [], // Exam templates created by teacher
        assignments: [], // Exams assigned to students
        settings: { theme: 'light' },
        isLoading: false
    };

    // ===================================================================================
    // JS: 2. API Simulyasiyası - Real backend-i təqlid edir
    // ===================================================================================
    const ApiService = {
        _latency: (data) => new Promise(resolve => setTimeout(() => resolve(data), 300)),
        
        initData: function() {
            let users = JSON.parse(localStorage.getItem('users'));
            let questions = JSON.parse(localStorage.getItem('questions'));
            let exams = JSON.parse(localStorage.getItem('exams')) || [];
            let assignments = JSON.parse(localStorage.getItem('assignments')) || [];

            if (!users) {
                users = [
                    { id: 1, name: "Dr. Elvin Ağayev", role: 'teacher', email: 'e.agayev@edu.az' },
                    { id: 2, name: "Leyla Quliyeva", role: 'student', email: 'l.quliyeva@edu.az' },
                    { id: 3, name: "Samir Vəliyev", role: 'student', email: 's.veliyev@edu.az' },
                    { id: 4, name: "Ayan Həsənova", role: 'student', email: 'a.hasanova@edu.az' }
                ];
                localStorage.setItem('users', JSON.stringify(users));
            }
            if (!questions) {
                questions = [
                    { id: 1, subject: 'Coğrafiya', difficulty: 'asan', text: 'Dünyanın ən hündür dağı hansıdır?', options: ['Monblan', 'K2', 'Everest', 'Elbrus'], correctAnswer: 'Everest' },
                    { id: 2, subject: 'Biologiya', difficulty: 'orta', text: 'İnsan bədənində neçə sümük var?', options: ['206', '212', '198', '221'], correctAnswer: '206' },
                    { id: 3, subject: 'Tarix', difficulty: 'asan', text: 'İkinci Dünya Müharibəsi neçənci ildə başlamışdır?', options: ['1935', '1939', '1941', '1945'], correctAnswer: '1939' },
                    { id: 4, subject: 'Fizika', difficulty: 'çətin', text: 'Nyutonun ikinci qanunu hansı düsturla ifadə olunur?', options: ['E=mc²', 'F=ma', 'P=IV', 'V=IR'], correctAnswer: 'F=ma' },
                    { id: 5, subject: 'Coğrafiya', difficulty: 'orta', text: 'Ən böyük okean hansıdır?', options: ['Atlantik', 'Hind', 'Sakit', 'Şimal Buzlu'], correctAnswer: 'Sakit' },
                ];
                localStorage.setItem('questions', JSON.stringify(questions));
            }
            
            return this._latency({ users, questions, exams, assignments });
        },
        
        login: function(userId) {
            const users = JSON.parse(localStorage.getItem('users')) || [];
            const user = users.find(u => u.id === userId);
            localStorage.setItem('currentUser', JSON.stringify(user));
            return this._latency(user);
        },
        
        logout: function() {
            localStorage.removeItem('currentUser');
            return this._latency(null);
        },
        
        saveQuestion: function(question) {
            let questions = JSON.parse(localStorage.getItem('questions')) || [];
            if(question.id) { // Update
                questions = questions.map(q => q.id === question.id ? question : q);
            } else { // Create
                question.id = Date.now();
                questions.push(question);
            }
            localStorage.setItem('questions', JSON.stringify(questions));
            return this._latency(questions);
        },

        saveExam: function(exam) {
            let exams = JSON.parse(localStorage.getItem('exams')) || [];
            exam.id = Date.now();
            exams.push(exam);
            localStorage.setItem('exams', JSON.stringify(exams));
            return this._latency(exam);
        },
        
        assignExam: function(assignmentData) {
            let assignments = JSON.parse(localStorage.getItem('assignments')) || [];
            assignmentData.studentIds.forEach(studentId => {
                assignments.push({
                    id: Date.now() + Math.random(),
                    examId: assignmentData.examId,
                    studentId: studentId,
                    status: 'gözləyir',
                    result: null,
                    assignedDate: new Date().toISOString()
                });
            });
            localStorage.setItem('assignments', JSON.stringify(assignments));
            return this._latency(assignments);
        },
        
        submitAssignment: function(assignmentId, result) {
            let assignments = JSON.parse(localStorage.getItem('assignments')) || [];
            const assignment = assignments.find(a => a.id === assignmentId);
            if(assignment) {
                assignment.status = 'tamamlanıb';
                assignment.result = result;
            }
            localStorage.setItem('assignments', JSON.stringify(assignments));
            return this._latency(assignment);
        }
        // ... digər API metodları
    };

    // ===================================================================================
    // JS: 3. Köməkçi Funksiyalar (Utilities)
    // ===================================================================================
    const Utils = {
        $: (selector, parent = document) => parent.querySelector(selector),
        $$: (selector, parent = document) => parent.querySelectorAll(selector),
        showToast: (message, type = 'success') => { /* ... (əvvəlki kod) ... */ },
        renderLoader: () => `<div class="loader"></div>`,
        renderDataTable: (id, columns, data, filters = '') => {
            const headers = columns.map(c => `<th data-sort="${c.key}">${c.label} <span class="sort-icon"></span></th>`).join('');
            const rows = data.map(row => `<tr>${columns.map(c => `<td>${c.render ? c.render(row) : row[c.key]}</td>`).join('')}</tr>`).join('');
            return `<div class="card">
                        <div class="table-filters">${filters}</div>
                        <div class="table-wrapper"><table class="data-table" id="${id}"><thead><tr>${headers}</tr></thead><tbody>${rows}</tbody></table></div>
                    </div>`;
        },
        attachTableSorters: (tableId, data, renderFn) => {
            const table = Utils.$(`#${tableId}`);
            if(!table) return;
            let sortKey = '';
            let sortOrder = 'asc';
            Utils.$$('th', table).forEach(th => {
                th.addEventListener('click', () => {
                    const key = th.dataset.sort;
                    if (sortKey === key) {
                        sortOrder = sortOrder === 'asc' ? 'desc' : 'asc';
                    } else {
                        sortKey = key;
                        sortOrder = 'asc';
                    }
                    data.sort((a, b) => {
                        if (a[sortKey] < b[sortKey]) return sortOrder === 'asc' ? -1 : 1;
                        if (a[sortKey] > b[sortKey]) return sortOrder === 'asc' ? 1 : -1;
                        return 0;
                    });
                    renderFn(); // Re-render the component with sorted data
                });
            });
        }
    };
    
    // ===================================================================================
    // JS: 4. UI Komponentləri - Hər "səhifə" bir komponentdir
    // ===================================================================================
    // --- NAVİQASİYA KOMPONENTİ ---
    const NavbarComponent = {
        render: () => {
            if (!appState.currentUser) return '';
            const { role } = appState.currentUser;
            const links = {
                '#dashboard': 'İdarə Paneli',
                ...(role === 'teacher' && { '#students': 'Tələbələr', '#questions': 'Sual Bankı', '#exams': 'İmtahanlar' }),
                ...(role === 'student' && { '#assignments': 'Tapşırıqlarım' }),
                '#settings': 'Ayarlar'
            };
            return `<div class="container">
                        <a href="#dashboard" class="nav-logo">EduSys Pro</a>
                        <nav><ul class="nav-links">
                            ${Object.entries(links).map(([hash, text]) => `<li><a href="${hash}" class="${appState.currentRoute === hash ? 'active-link' : ''}">${text}</a></li>`).join('')}
                            <li><button id="logout-btn" class="btn btn-danger">Çıxış</button></li>
                        </ul></nav>
                    </div>`;
        },
        attachEventListeners: () => {
            if (!appState.currentUser) return;
            Utils.$('#logout-btn').addEventListener('click', async () => { /* ... (əvvəlki kod) ... */ });
        }
    };

    // --- GİRİŞ KOMPONENTİ ---
    const LoginComponent = {
        render: () => {
            const userOptions = appState.users.map(user => `<option value="${user.id}">${user.name} (${user.role})</option>`).join('');
            return `<div class="card" style="text-align: center; max-width: 500px; margin: 100px auto;">
                        <h1>Platformaya Daxil Olun</h1>
                        <p>Zəhmət olmasa, istifadəçi profilinizi seçin.</p>
                        <select id="user-select" class="form-group" style="width:100%; padding:10px; margin-top:20px;">
                            <option value="">İstifadəçi seçin...</option>${userOptions}
                        </select>
                        <button id="login-btn" class="btn btn-primary" disabled>Daxil Ol</button>
                    </div>`;
        },
        attachEventListeners: () => {
            const select = Utils.$('#user-select');
            const btn = Utils.$('#login-btn');
            select.addEventListener('change', () => btn.disabled = !select.value);
            btn.addEventListener('click', async () => {
                appState.currentUser = await ApiService.login(parseInt(select.value));
                await App.initData();
                Router.navigate('#dashboard');
            });
        }
    };
    
    // --- MÜƏLLİM: TƏLƏBƏ İDARƏETMƏ KOMPONENTİ ---
    const StudentsComponent = {
        render: () => {
            const students = appState.users.filter(u => u.role === 'student');
            const columns = [
                { key: 'id', label: 'ID' },
                { key: 'name', label: 'Ad Soyad' },
                { key: 'email', label: 'Email' },
                { key: 'actions', label: 'Əməliyyatlar', render: (row) => `<button class="btn btn-secondary btn-sm">Profilə Bax</button>` }
            ];
            return `<h2>Tələbə İdarəetməsi</h2>` + Utils.renderDataTable('students-table', columns, students);
        },
        attachEventListeners: () => Utils.attachTableSorters('students-table', appState.users.filter(u=>u.role==='student'), StudentsComponent.renderAndUpdate)
    };

    // --- MÜƏLLİM: SUAL BANKI KOMPONENTİ ---
    const QuestionsComponent = {
        state: {
            filterSubject: 'all',
            filterDifficulty: 'all',
            searchTerm: ''
        },
        render: () => {
            let filteredQuestions = appState.questions;
            if (QuestionsComponent.state.filterSubject !== 'all') {
                filteredQuestions = filteredQuestions.filter(q => q.subject === QuestionsComponent.state.filterSubject);
            }
            if (QuestionsComponent.state.filterDifficulty !== 'all') {
                filteredQuestions = filteredQuestions.filter(q => q.difficulty === QuestionsComponent.state.filterDifficulty);
            }
            if (QuestionsComponent.state.searchTerm) {
                filteredQuestions = filteredQuestions.filter(q => q.text.toLowerCase().includes(QuestionsComponent.state.searchTerm.toLowerCase()));
            }

            const subjects = [...new Set(appState.questions.map(q => q.subject))];
            const difficulties = ['asan', 'orta', 'çətin'];

            const filters = `
                <input type="text" id="search-questions" placeholder="Sual mətnində axtar..." value="${QuestionsComponent.state.searchTerm}">
                <select id="filter-subject">
                    <option value="all">Bütün Fənlər</option>
                    ${subjects.map(s => `<option value="${s}" ${QuestionsComponent.state.filterSubject === s ? 'selected' : ''}>${s}</option>`).join('')}
                </select>
                <select id="filter-difficulty">
                    <option value="all">Bütün Çətinliklər</option>
                    ${difficulties.map(d => `<option value="${d}" ${QuestionsComponent.state.filterDifficulty === d ? 'selected' : ''}>${d.charAt(0).toUpperCase() + d.slice(1)}</option>`).join('')}
                </select>
            `;
            const columns = [
                { key: 'text', label: 'Sual Mətni', render: q => q.text.substring(0, 50) + '...' },
                { key: 'subject', label: 'Fənn' },
                { key: 'difficulty', label: 'Çətinlik' }
            ];
            return `<h2>Sual Bankı</h2>` + Utils.renderDataTable('questions-table', columns, filteredQuestions, filters);
        },
        attachEventListeners: () => {
            Utils.$('#search-questions').addEventListener('input', e => {
                QuestionsComponent.state.searchTerm = e.target.value;
                QuestionsComponent.renderAndUpdate();
            });
            Utils.$('#filter-subject').addEventListener('change', e => {
                QuestionsComponent.state.filterSubject = e.target.value;
                QuestionsComponent.renderAndUpdate();
            });
            Utils.$('#filter-difficulty').addEventListener('change', e => {
                QuestionsComponent.state.filterDifficulty = e.target.value;
                QuestionsComponent.renderAndUpdate();
            });
            Utils.attachTableSorters('questions-table', appState.questions, QuestionsComponent.renderAndUpdate);
        },
        renderAndUpdate: () => {
             Utils.$('#main-content').innerHTML = QuestionsComponent.render();
             QuestionsComponent.attachEventListeners();
        }
    };

    // --- MÜƏLLİM: İMTAHAN KONSTRUKTORU KOMPONENTİ ---
    const ExamsComponent = {
        state: {
            selectedQuestionIds: new Set(),
            assignToStudentIds: new Set()
        },
        render: () => `
            <h2>İmtahan Konstruktoru</h2>
            <div class="exam-builder-container">
                <div class="card">
                    <h3>1. Sual Seçimi</h3>
                    <div class="question-selection-list">
                    ${appState.questions.map(q => `
                        <div class="question-selection-item">
                            <span><b>${q.subject}:</b> ${q.text.substring(0,40)}...</span>
                            <button class="btn btn-sm ${ExamsComponent.state.selectedQuestionIds.has(q.id) ? 'btn-danger' : 'btn-success'}" data-question-id="${q.id}">
                                ${ExamsComponent.state.selectedQuestionIds.has(q.id) ? 'Çıxar' : 'Əlavə et'}
                            </button>
                        </div>`).join('')}
                    </div>
                </div>
                <div class="card">
                    <h3>2. İmtahan Tənzimləmələri</h3>
                    <div class="form-group">
                        <label for="exam-title">İmtahan Adı</label>
                        <input type="text" id="exam-title" placeholder="Məs: Riyaziyyat Yoxlama">
                    </div>
                     <div class="form-group">
                        <label>Tələbə Seçimi</label>
                        ${appState.users.filter(u => u.role === 'student').map(s => `<div><label><input type="checkbox" class="student-assign-check" value="${s.id}"> ${s.name}</label></div>`).join('')}
                    </div>
                    <button id="create-assign-btn" class="btn btn-primary" style="width:100%;">İmtahanı Yarat və Təyin Et</button>
                </div>
            </div>`,
        attachEventListeners: () => {
            Utils.$$('[data-question-id]').forEach(btn => btn.addEventListener('click', e => {
                const id = parseInt(e.target.dataset.questionId);
                if (ExamsComponent.state.selectedQuestionIds.has(id)) {
                    ExamsComponent.state.selectedQuestionIds.delete(id);
                } else {
                    ExamsComponent.state.selectedQuestionIds.add(id);
                }
                // Re-render to update button text
                ExamsComponent.renderAndUpdate();
            }));

            Utils.$('#create-assign-btn').addEventListener('click', async () => {
                const title = Utils.$('#exam-title').value;
                const studentIds = [...Utils.$$('.student-assign-check:checked')].map(cb => parseInt(cb.value));

                if (!title || ExamsComponent.state.selectedQuestionIds.size === 0 || studentIds.length === 0) {
                    Utils.showToast("Bütün xanaları doldurun!", 'error'); return;
                }
                const newExam = await ApiService.saveExam({ title, questionIds: [...ExamsComponent.state.selectedQuestionIds] });
                await ApiService.assignExam({ examId: newExam.id, studentIds: studentIds });

                Utils.showToast('İmtahan uğurla yaradıldı və təyin edildi!', 'success');
                ExamsComponent.state.selectedQuestionIds.clear();
                ExamsComponent.renderAndUpdate();
            });
        },
         renderAndUpdate: () => { // Helper to re-render component
             Utils.$('#main-content').innerHTML = ExamsComponent.render();
             ExamsComponent.attachEventListeners();
        }
    };
    
    // --- TƏLƏBƏ: TAPŞIRIQLARIM KOMPONENTİ ---
    const AssignmentsComponent = {
        render: () => {
            const myAssignments = appState.assignments.filter(a => a.studentId === appState.currentUser.id);
            const pending = myAssignments.filter(a => a.status === 'gözləyir');
            const completed = myAssignments.filter(a => a.status === 'tamamlanıb');

            const renderList = (list) => {
                if (list.length === 0) return '<p>Bu bölmədə tapşırıq yoxdur.</p>';
                return list.map(a => {
                    const exam = appState.exams.find(e => e.id === a.examId);
                    return `<div class="card">
                        <h4>${exam.title}</h4>
                        <p>Status: ${a.status}</p>
                        ${a.status === 'gözləyir' ? `<button class="btn btn-success" onclick="startExam(${a.id})">İmtahana Başla</button>` : `<p>Nəticə: ${a.result.score.toFixed(2)}%</p>`}
                    </div>`;
                }).join('');
            };

            return `<h2>Tapşırıqlarım</h2>
                <h3>Gözləyən İmtahanlar</h3>
                ${renderList(pending)}
                <h3>Tamamlanmış İmtahanlar</h3>
                ${renderList(completed)}`;
        },
        attachEventListeners: () => {}
    };

    // ... digər komponentlər (Dashboard, Settings, NotFound) əvvəlki kimi qala bilər və ya bu yeni data modelinə uyğunlaşdırıla bilər

    // ===================================================================================
    // JS: 5. Router - Səhifələri idarə edir
    // ===================================================================================
    const Router = {
        routes: {
            '#login': LoginComponent,
            '#dashboard': { render: () => '<h2>Dashboard</h2><p>Xoş Gəlmisiniz!</p>', attachEventListeners: () => {} }, // Sadələşdirilmiş
            '#students': StudentsComponent,
            '#questions': QuestionsComponent,
            '#exams': ExamsComponent,
            '#assignments': AssignmentsComponent,
            '#settings': { render: () => '<h2>Ayarlar</h2>', attachEventListeners: () => {} } // Sadələşdirilmiş
        },
        navigate: (hash) => { window.location.hash = hash; },
        handleRouteChange: () => {
            appState.currentRoute = window.location.hash || '#login';
            
            // ... (giriş yoxlama məntiqi əvvəlki kimidir)
            
            const component = Router.routes[appState.currentRoute] || { render: () => '404 Not Found' };
            Utils.$('#navbar-container').innerHTML = NavbarComponent.render();
            Utils.$('#main-content').innerHTML = component.render();
            NavbarComponent.attachEventListeners();
            if (component.attachEventListeners) component.attachEventListeners();
        }
    };

    // ===================================================================================
    // JS: 6. Tətbiqin Başladılması
    // ===================================================================================
    const App = {
        initData: async () => {
            const data = await ApiService.initData();
            appState.users = data.users;
            appState.questions = data.questions;
            appState.exams = data.exams;
            appState.assignments = data.assignments;
        },
        init: async () => {
            await App.initData(); // Dataları hər zaman yüklə
            
            const savedUser = JSON.parse(localStorage.getItem('currentUser'));
            if (savedUser) {
                appState.currentUser = savedUser;
            }

            window.addEventListener('hashchange', Router.handleRouteChange);
            if (!window.location.hash) {
                window.location.hash = appState.currentUser ? '#dashboard' : '#login';
            } else {
                Router.handleRouteChange();
            }
        }
    };

    App.init();

    // Qlobal funksiyalar (onclick üçün)
    function startExam(assignmentId) {
        alert(`İmtahan ${assignmentId} başladı! (Bu hissənin funksionallığı əlavə edilə bilər)`);
    }

    </script>
</body>
</html>
